; ============================================================
;  ESP32 IoT Lab Gadget
;  Board  : ESP32 DevKit V1
;  Display: 3.5" SPI TFT 480x320 (ILI9488) + XPT2046 touch
;  Audio  : MAX98357A I2S amplifier
;
;  Two programs share these settings:
;    esp32dev = the main gadget (menu, radio, calculator, clock, timer, piano)
;    hwtest   = hardware test for touch and sound
;  Library versions are pinned so the project builds the same way later.
; ============================================================

[env]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 is more reliable than 921600 with the display and amp wired on a breadboard
upload_speed = 460800
; Bigger app area (3 MB) because of the radio decoders. No OTA in this layout.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 7.2.1
    https://github.com/esphome/ESP32-audioI2S.git#6ca9d7ed73c8c003ffda03cb2f995dad5669ba89

; TFT_eSPI is configured here, so you never need to edit its User_Setup.h file.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    ; If the screen stays white, use ST7796_DRIVER instead of ILI9488_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:esp32dev]
build_src_filter = +<*> -<hwtest.cpp> -<mictest.cpp>

[env:hwtest]
build_src_filter = -<*> +<hwtest.cpp> +<tones.cpp>

; Microphone test: live sound level, record 3 seconds and play it back
[env:mictest]
build_src_filter = -<*> +<mictest.cpp>

; Same test for the MAX9814 analog microphone on GPIO 35
[env:mictest-analog]
build_src_filter = -<*> +<mictest.cpp>
build_flags = ${env.build_flags} -D MIC_ANALOG=1
